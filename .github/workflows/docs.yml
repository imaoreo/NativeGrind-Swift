name: Deploy Multi-Target Documentation

on:
  push:
    branches:
      - main 
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_PATH" ]; then sudo xcode-select -s "$XCODE_PATH"; fi
          xcodebuild -version

      - name: Clear Previous Build Artifacts
        run: rm -rf ./docs-out && mkdir -p ./docs-out

      - name: Build Docs for NativeGrind
        run: |
          set -euo pipefail
          xcodebuild docbuild -scheme "NativeGrind" -destination "generic/platform=iOS" -derivedDataPath ./build/NativeGrind CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=17.0
          APP_ARCHIVE="./build/NativeGrind/Build/Products/Debug-iphoneos/NativeGrind.doccarchive"
          if [ ! -d "$APP_ARCHIVE" ]; then
            APP_ARCHIVE=$(find ./build/NativeGrind -type d -name "NativeGrind.doccarchive" | head -1)
          fi
          if [ -z "${APP_ARCHIVE:-}" ] || [ ! -d "$APP_ARCHIVE" ]; then
            echo "NativeGrind.doccarchive not found"
            exit 1
          fi
          xcrun docc process-archive transform-for-static-hosting "$APP_ARCHIVE" --output-path ./docs-out/app --hosting-base-path "${{ github.event.repository.name }}/app"

      # NativeGrindCore
      - name: Build Docs for NativeGrindCore
        run: |
          set -euo pipefail
          xcodebuild docbuild -scheme "NativeGrindCore" -derivedDataPath ./build/NativeGrindCore CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          CORE_ARCHIVE=$(find ./build/NativeGrindCore -type d -name "NativeGrindCore.doccarchive" | head -1)
          if [ -z "${CORE_ARCHIVE:-}" ] || [ ! -d "$CORE_ARCHIVE" ]; then
            echo "NativeGrindCore.doccarchive not found"
            exit 1
          fi
          xcrun docc process-archive transform-for-static-hosting "$CORE_ARCHIVE" --output-path ./docs-out/core --hosting-base-path "${{ github.event.repository.name }}/core"

      # NativeGrind Watch
      - name: Build Docs for NativeGrind Watch
        run: |
          set -euo pipefail
          xcodebuild docbuild -target "WatchNativeGrind" -destination "generic/platform=watchOS" -derivedDataPath ./build/NativeGrindWatch CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO WATCHOS_DEPLOYMENT_TARGET=10.0 CODE_SIGNING_ALLOWED=NO
          WATCH_ARCHIVE="./build/NativeGrindWatch/Build/Products/Debug-watchos/WatchNativeGrind Watch App.doccarchive"
          if [ ! -d "$WATCH_ARCHIVE" ]; then
            WATCH_ARCHIVE=$(find ./build/NativeGrindWatch -type d -name "WatchNativeGrind Watch App.doccarchive" | head -1)
          fi
          if [ -z "${WATCH_ARCHIVE:-}" ] || [ ! -d "$WATCH_ARCHIVE" ]; then
            echo "WatchNativeGrind Watch App.doccarchive not found"
            exit 1
          fi
          xcrun docc process-archive transform-for-static-hosting "$WATCH_ARCHIVE" --output-path ./docs-out/watch --hosting-base-path "${{ github.event.repository.name }}/watch"

      # Landing Page
      - name: Create Root Landing Page
        run: |
          APP_DOC_PATH=$(find ./docs-out/app/documentation -mindepth 1 -maxdepth 1 -type d | head -1 | sed 's|^./docs-out/app||')
          CORE_DOC_PATH=$(find ./docs-out/core/documentation -mindepth 1 -maxdepth 1 -type d | head -1 | sed 's|^./docs-out/core||')
          WATCH_DOC_PATH=$(find ./docs-out/watch/documentation -mindepth 1 -maxdepth 1 -type d | head -1 | sed 's|^./docs-out/watch||')

          APP_HREF="${APP_DOC_PATH:-/documentation/nativegrind}"
          CORE_HREF="${CORE_DOC_PATH:-/documentation/nativegrindcore}"
          WATCH_HREF="${WATCH_DOC_PATH:-/documentation/watchnativegrind_watch_app}"

          cat << EOF > ./docs-out/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>NativeGrind Developer Documentation</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1c1c1e; color: #f5f5f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
                  .container { text-align: center; max-width: 600px; }
                  h1 { color: #fff; margin-bottom: 30px; }
                  .card { background: #2c2c2e; padding: 20px; border-radius: 12px; margin: 15px 0; text-decoration: none; color: #0a84ff; display: block; font-weight: bold; transition: background 0.2s; border: 1px solid #3a3a3c; }
                  .card:hover { background: #3a3a3c; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>NativeGrind Documentation Portal</h1>
                <a class="card" href="./app${APP_HREF}">NativeGrind iOS App Docs</a>
                <a class="card" href="./core${CORE_HREF}">NativeGrindCore Framework Docs</a>
                <a class="card" href="./watch${WATCH_HREF}">NativeGrind Watch Docs</a>
              </div>
          </body>
          </html>
          EOF

      - name: Upload Static Assets Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs-out

  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
